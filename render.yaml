services:
  - type: web
    name: job-tracker-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: job-tracker-db
    plan: free
